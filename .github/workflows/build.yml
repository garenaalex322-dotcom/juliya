name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Установить Gradle 8.7
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Скачать Firebase SDK
        shell: bash
        run: |
          mkdir -p app/src/main/assets/vendor
          for m in app auth firestore; do
            curl -sSfL -o "app/src/main/assets/vendor/firebase-$m-compat.js" "https://www.gstatic.com/firebasejs/10.14.1/firebase-$m-compat.js"
          done
          ls -la app/src/main/assets/vendor

      - name: Собрать APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk tarelka.apk

      - name: Показать ошибку сборки
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -E "What went wrong|error:|e: |Could not|FAILURE|Exception" -A4 build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Сборка не прошла::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: tarelka-apk
          path: tarelka.apk

      - name: Выпустить релиз
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Тарелка и штанга, версия ${{ github.run_number }}
          files: tarelka.apk
