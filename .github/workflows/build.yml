name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Назвать файл
        run: cp app/build/outputs/apk/release/app-release.apk tarelka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tarelka-apk
          path: tarelka.apk

      - name: Выпустить релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Тарелка и штанга, версия ${{ github.run_number }}
          files: tarelka.apk
