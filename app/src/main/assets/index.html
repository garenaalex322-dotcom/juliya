<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3F4">
<title>Тарелка и штанга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app (max 520px), sticky day header, the day's "plate" ring as the hero, fixed bottom tab bar. */
:root{
  --bg:#F5F3F4; --surface:#FFFFFF; --sunken:#ECE6E9; --line:#E1D9DD; --fg:#241C21; --muted:#6E6369;
  --accent:#A32F58; --accent-ink:#FFFFFF; --accent-soft:#F6E2E9;
  --prot:#2F6C97; --fat:#B97F14; --carb:#53843F; --water:#2F86BF; --warn:#A35E0B;
  --shade:rgba(30,16,24,.45);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151114; --surface:#1F191D; --sunken:#2B2328; --line:#3A3036; --fg:#F2ECEF; --muted:#AA9DA4;
    --accent:#E36A92; --accent-ink:#1B0E14; --accent-soft:#3C2330;
    --prot:#73ABD6; --fat:#E0AE4E; --carb:#8EBF77; --water:#6CB5E8; --warn:#E5A453;
    --shade:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151114; --surface:#1F191D; --sunken:#2B2328; --line:#3A3036; --fg:#F2ECEF; --muted:#AA9DA4;
  --accent:#E36A92; --accent-ink:#1B0E14; --accent-soft:#3C2330;
  --prot:#73ABD6; --fat:#E0AE4E; --carb:#8EBF77; --water:#6CB5E8; --warn:#E5A453;
  --shade:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
h1,h2,h3{text-wrap:balance}
#app{max-width:520px;margin-inline:auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;display:flex;align-items:center;gap:10px}
.hd h1{margin:0;flex:1;font:700 19px/1.2 var(--font-display);letter-spacing:-.01em}
.hd-date{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.hd-date strong{font:600 17px/1.2 var(--font-display)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:600 16px/1.3 var(--font-body)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
p{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 2px}
.btn-warn{background:var(--surface);border-color:var(--line);color:var(--warn)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.input{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input-sm{min-height:38px;padding:6px 9px}
textarea.input{resize:vertical;min-height:64px;line-height:1.4}
select.input{appearance:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}

/* banners */
.banner{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1;min-width:200px;font-size:14px}
.banner.warn{background:var(--sunken)}

/* plate */
.plate{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.plate svg{width:160px;height:160px;flex:none;margin-inline:auto}
.rim{fill:none;stroke:var(--sunken);stroke-width:18}
.plate-in{fill:var(--bg);stroke:var(--line);stroke-width:1}
.seg{fill:none;stroke-width:18}
.seg-p{stroke:var(--prot)} .seg-f{stroke:var(--fat)} .seg-c{stroke:var(--carb)}
.ring-big{font:700 30px var(--font-display);fill:var(--fg);font-variant-numeric:tabular-nums}
.ring-big.over{fill:var(--warn)}
.ring-small{font:500 12px var(--font-body);fill:var(--muted)}
.macros{flex:1;min-width:180px;display:flex;flex-direction:column;gap:11px}
.mrow{display:flex;flex-direction:column;gap:5px}
.mtop{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mtop b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .3s}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.eaten-line{font-size:14px;color:var(--muted);text-align:center;width:100%}
.eaten-line b{color:var(--fg)}

/* water */
.glasses{display:flex;flex-wrap:wrap;gap:4px}
.glass{width:34px;height:42px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.glass.on{color:var(--water)}

/* meals */
.add-main{min-height:52px;font-size:16px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.meal-hd{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px}
.meal-hd h3{margin:0;flex:1;font:600 15px var(--font-body)}
.meal-kcal{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.add-mini{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--accent);padding:0}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.item-name{flex:1;min-width:0}
.item-name small{display:block;font-size:13px;color:var(--muted)}
.item-kcal{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:0 16px 12px;color:var(--muted);font-size:13px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
.sheet-back{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 0;flex:none}
.sheet-hd{display:flex;align-items:center;gap:10px}
.sheet-hd h2{margin:0;flex:1;font:700 18px/1.2 var(--font-display)}
.segm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunken);padding:4px;border-radius:12px}
.segm.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.segm button{border:0;background:none;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.segm button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pv{display:flex;flex-direction:column}
.pv-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.pv-name small{display:block;font-size:12px;color:var(--muted)}
.pv-g{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.pv-g input{width:70px;text-align:right;color:var(--fg)}
.pv-kcal{font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;white-space:nowrap}
.x-btn{width:32px;height:32px;border-radius:50%;border:0;background:var(--sunken);display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.unknown{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.results{display:flex;flex-direction:column}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.res span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* training */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.wd i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.wd i.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd.today b{color:var(--fg)}
.ex{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow small{display:block;color:var(--muted);font-size:13px}
.edit-ex{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.edit-ex .row{grid-column:1/-1;justify-content:flex-end}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.confirm{background:var(--sunken);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font:700 18px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.ax{font:500 10px var(--font-body);fill:var(--muted)}
.grid-l{stroke:var(--line);stroke-width:1}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
.down{color:var(--carb)} .up{color:var(--warn)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.norm{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.norm b.big{font:700 22px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
@media (max-width:360px){ .grid3{grid-template-columns:repeat(2,minmax(0,1fr))} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

// Разбор текста «гречка 150 г, 2 яйца, чай с сахаром» в продукты с граммовкой
const normTxt = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
const FOODS = RAW.map((r, i) => Object.assign({
  id: 'f' + i, name: r[0],
  aliases: r[1].split('|').map(a => normTxt(a).split(' ').filter(Boolean)),
  kcal: r[2], p: r[3], f: r[4], c: r[5], portion: r[6], piece: r[7] || 0
}, r[8] || {}));
const foodByName = n => FOODS.find(f => f.name === n);

let customProvider = () => [];
function stemsOf(name) {
  return normTxt(name).split(/[^а-яa-z0-9]+/).filter(w => w.length >= 3)
    .map(w => (w.length > 5 ? w.slice(0, w.length - 2) : w));
}
function customFoods() {
  return customProvider().map(c => {
    const st = stemsOf(c.name);
    const al = [];
    if (st.length) al.push(st);
    if (st.length > 1) al.push([st[0]]);
    const piece = +c.piece || 0;
    return { id: c.id, name: c.name, aliases: al, kcal: +c.kcal || 0, p: +c.p || 0, f: +c.f || 0, c: +c.c || 0,
      portion: piece || 100, piece, custom: true };
  });
}
const allFoods = () => customFoods().concat(FOODS);
const foodById = id => allFoods().find(f => f.id === id);

const STOP = new Set(['с','со','на','в','во','без','из','для','от','по','к','и','или','а','еще','немного','чуть','мой','моя','свой']);
const NUMW = new Map(Object.entries({ 'один':1,'одна':1,'одно':1,'одну':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,
  'шесть':6,'семь':7,'восемь':8,'десять':10,'пол':0.5,'половина':0.5,'половину':0.5,'половинка':0.5,'половинку':0.5,
  'полтора':1.5,'полторы':1.5,'пара':2,'пару':2 }));

function unitOf(t) {
  if (/^(г|гр|грам|грамм|грамма|граммов|грамов)$/.test(t)) return 'g';
  if (/^(кг|кило|килограмм[а-я]*)$/.test(t)) return 'kg';
  if (/^(мл|миллилитр[а-я]*)$/.test(t)) return 'ml';
  if (/^(л|литр[а-я]*)$/.test(t)) return 'l';
  if (/^(шт|штук[а-я]*|штуч[а-я]*)$/.test(t)) return 'pc';
  if (t === 'стл' || /^столов/.test(t)) return 'tbsp';
  if (t === 'чл' || /^чайн/.test(t) || /^ложечк/.test(t)) return 'tsp';
  if (/^(ложк|ложек)/.test(t)) return 'tbsp';
  if (/^стакан/.test(t)) return 'glass';
  if (/^(чашк|чашек|чашеч)/.test(t)) return 'cup';
  if (/^(кружк|кружек)/.test(t)) return 'mug';
  if (/^(тарелк|тарелоч|тарелок)/.test(t)) return 'plate';
  if (!/^кускус/.test(t) && /^(кус|ломт|дольк|долек)/.test(t)) return 'pc';
  if (/^порци/.test(t)) return 'portion';
  if (/^горст/.test(t)) return 'handful';
  if (/^бокал/.test(t)) return 'wineglass';
  if (/^плитк/.test(t)) return 'bar';
  if (/^(упаковк|пачк)/.test(t)) return 'pack';
  return null;
}

const POL = /пол(?=(тарелк|стакан|чашк|кружк|порци|банан|яблок|плитк|батон|булк|литр|кило|ложк|пачк|упаковк|авокад|огурц|помидор|апельсин|пицц|шоколадк|лаваш|кусочк|куска))/g;
function prep(s) {
  return normTxt(s)
    .replace(/(^|[^а-я])ст\.?\s*л\.?(?![а-я])/g, '$1 стл ')
    .replace(/(^|[^а-я])ч\.?\s*л\.?(?![а-я])/g, '$1 чл ')
    .replace(POL, 'пол ')
    .replace(/(\d),(\d)/g, '$1.$2')
    .replace(/(\d+(?:\.\d+)?)\s*%/g, ' pct$1 ')
    .replace(/(\d)([а-яa-z])/g, '$1 $2');
}
const tokenize = chunk => chunk.split(/[^а-яa-z0-9.]+/).map(t => t.replace(/^\.+|\.+$/g, '')).filter(Boolean);

function analyze(toks) {
  let num = null, unit = null, pct = null, skip = 0;
  const words = [];
  for (const t of toks) {
    if (/^pct\d/.test(t)) { pct = parseFloat(t.slice(3)); continue; }
    if (/^\d+(\.\d+)?$/.test(t)) { if (num === null) num = parseFloat(t); continue; }
    if (NUMW.has(t) && num === null) { num = NUMW.get(t); continue; }
    const u = unitOf(t);
    if (u) { if (!unit) unit = u; continue; }
    if (t === 'без') { skip = 1; words.push(t); continue; }
    if (skip && !STOP.has(t)) { skip--; continue; }
    words.push(t);
  }
  return { num, unit, pct, words };
}

function matchAlias(alias, words) {
  const idx = [];
  let from = 0;
  for (const st of alias) {
    let found = -1;
    for (let j = from; j < words.length; j++) {
      const w = words[j];
      if (STOP.has(w)) continue;
      if (idx.length && j - idx[idx.length - 1] > 3) break;
      if (w.startsWith(st)) { found = j; break; }
    }
    if (found < 0) return null;
    idx.push(found);
    from = found + 1;
  }
  let score = alias.reduce((s, st) => s + st.length, 0) + 2 * (alias.length - 1);
  if (alias.length === 1 && words[idx[0]] === alias[0]) score += 1;
  return { idx, score };
}
function bestMatch(words) {
  let best = null;
  for (const food of allFoods()) for (const al of food.aliases) {
    const m = matchAlias(al, words);
    if (!m) continue;
    const sc = m.score + (food.custom && al.length > 1 ? 3 : 0);
    if (!best || sc > best.score || (sc === best.score && m.idx[0] < best.idx[0])) best = { food, score: sc, idx: m.idx };
  }
  return best;
}

function gramsFor(food, num, unit) {
  const n = num == null ? 1 : num;
  const piece = food.piece || food.portion;
  switch (unit) {
    case 'g': case 'ml': return n;
    case 'kg': case 'l': return n * 1000;
    case 'pc': return n * piece;
    case 'tbsp': return n * (food.tbsp || 15);
    case 'tsp': return n * (food.tsp || 5);
    case 'glass': return n * 250;
    case 'cup': return n * 200;
    case 'mug': return n * 300;
    case 'plate': return n * food.portion;
    case 'portion': return n * food.portion;
    case 'handful': return n * 30;
    case 'wineglass': return n * (food.glass || 150);
    case 'bar': return n * 100;
    case 'pack': return n * food.portion;
    default:
      if (num == null) return food.portion;
      if (food.liq && num <= 3 && num % 1 !== 0) return num * 1000;
      if (food.piece && num <= 20) return num * food.piece;
      if (num <= 10) return num * food.portion;
      return num;
  }
}

function mkItem(food, a, src) {
  if (a.pct != null && food.low && a.pct <= 1.8) { const lf = foodByName(food.low); if (lf) food = lf; }
  const grams = Math.max(1, Math.round(gramsFor(food, a.num, a.unit)));
  return { food, grams, src, def: a.num == null && a.unit == null };
}
function spansWith(idx, words) {
  const a = Math.min(...idx), b = Math.max(...idx);
  for (let j = a + 1; j < b; j++) if (words[j] === 'с' || words[j] === 'со') return true;
  return false;
}
function parseChunk(raw) {
  const src = raw.trim();
  const toks = tokenize(src);
  if (!toks.length) return [];
  const whole = analyze(toks);
  if (!whole.words.some(w => !STOP.has(w))) return [];
  const best = bestMatch(whole.words);
  const hasWith = whole.words.some(w => w === 'с' || w === 'со');
  if (best && (!hasWith || spansWith(best.idx, whole.words))) return [mkItem(best.food, whole, src)];
  if (!hasWith) return [{ unknown: true, text: src }];
  const segs = [[]];
  for (const t of toks) { if (t === 'с' || t === 'со') segs.push([]); else segs[segs.length - 1].push(t); }
  const out = [];
  segs.forEach((seg, i) => {
    if (!seg.length) return;
    const a = analyze(seg);
    const m = bestMatch(a.words);
    if (m) out.push(mkItem(m.food, a, src));
    else if (i === 0) out.push({ unknown: true, text: seg.join(' ') });
  });
  return out.length ? out : [{ unknown: true, text: src }];
}
function parseText(text) {
  const items = [], unknown = [];
  prep(text).split(/[,;\n+]|\s+и\s+|\s+плюс\s+|\s+а\s+также\s+/).forEach(ch => {
    if (!ch || !ch.trim()) return;
    parseChunk(ch).forEach(r => (r.unknown ? unknown.push(r.text) : items.push(r)));
  });
  return { items, unknown };
}

function searchFoods(q) {
  const words = tokenize(prep(q));
  if (!words.length) return [];
  const qn = normTxt(q).trim();
  const scored = [];
  for (const food of allFoods()) {
    let sc = 0;
    const nm = normTxt(food.name);
    if (nm.startsWith(qn)) sc = 100; else if (nm.includes(qn)) sc = 60;
    for (const al of food.aliases) {
      const ok = al.every(st => words.some(w => w.startsWith(st) || (w.length >= 3 && st.startsWith(w))));
      if (ok) sc = Math.max(sc, 40 + al.length);
    }
    if (sc) scored.push([sc, food]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name, 'ru')).slice(0, 8).map(x => x[1]);
}

function previewData(){
  const parsed=parseText(ui.text);const items=[];const cnt={};
  parsed.items.forEach(it=>{const base='t|'+it.src+'|'+it.food.id;cnt[base]=(cnt[base]||0)+1;const key=base+'|'+cnt[base];
    if(ui.hidden.has(key))return;const g=ui.over[key];items.push({key,food:it.food,grams:g!=null?g:it.grams,def:it.def&&g==null})});
  ui.extra.forEach(x=>items.push({key:x.key,food:x.food,grams:ui.over[x.key]!=null?ui.over[x.key]:x.grams}));
  ui.manual.forEach(m=>items.push({key:m.key,manual:m}));
  return {items,unknown:parsed.unknown.filter(u=>!ui.hidden.has('u|'+u))};
}

/* ---------- PROGRESS ---------- */
function weightChart(list){
  if(list.length<2)return `<p class="muted small">График появится после второй записи веса.</p>`;
  const W=340,H=170,L=36,R=14,T=14,B=26;
  const ts=list.map(x=>pk(x.date).getTime()),t0=ts[0],t1=ts[ts.length-1]||t0+1;
  const ks=list.map(x=>x.kg);let lo=Math.floor((Math.min(...ks)-0.3)*2)/2,hi=Math.ceil((Math.max(...ks)+0.3)*2)/2;if(hi-lo<1){hi+=0.5;lo-=0.5}
  const X=t=>L+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[lo,(lo+hi)/2,hi];
  let g=ticks.map(v=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${f1(v)}</text>`).join('');
  const pts=list.map((x,i)=>[X(ts[i]),Y(x.kg)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const last=pts[pts.length-1];
  const d0=pk(list[0].date),d1=pk(list[list.length-1].date);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>`).join('')}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--accent)"/>
    <text class="ax" x="${L}" y="${H-8}">${pad(d0.getDate())}.${pad(d0.getMonth()+1)}</text><text class="ax" x="${W-R}" y="${H-8}" text-anchor="end">${pad(d1.getDate())}.${pad(d1.getMonth()+1)}</text></svg></div>`;
}
function kcalBars(){
  const t=todayKey(),tg=targets(),W=340,H=140,L=8,R=8,T=12,B=22;
  const days=[];for(let i=6;i>=0;i--){const k=addDays(t,-i);days.push([k,dayTotals(S.days[k]).kcal])}
  const max=Math.max(tg?tg.kcal*1.15:0,...days.map(d=>d[1]),500);
  const bw=(W-L-R)/7,Y=v=>T+(1-v/max)*(H-T-B);
  let s='';
  days.forEach(([k,v],i)=>{const x=L+i*bw+bw*0.2,w=bw*0.6;const y=Y(v);const d=pk(k);
    if(v>0)s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(H-B-y).toFixed(1)}" rx="4" fill="var(--accent)" fill-opacity="${k===t?1:.55}"/>`;
    else s+=`<rect x="${x.toFixed(1)}" y="${(H-B-3).toFixed(1)}" width="${w.toFixed(1)}" height="3" rx="1.5" fill="var(--line)"/>`;
    s+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${WDS[d.getDay()]}</text>`});

function buildReport(n,detail){
  const t=todayKey(),from=addDays(t,-(n-1)),tg=targets(),p=S.profile;const L=[];
  L.push(`Отчёт${p.name?': '+p.name:''} · ${fmtD(from)} — ${fmtD(t)}`);
  if(tg)L.push(`Норма: ${f0(tg.kcal)} ккал · Б ${f0(tg.p)} · Ж ${f0(tg.f)} · У ${f0(tg.c)}`);
  L.push('','ПИТАНИЕ (ккал · Б/Ж/У, г)');
  let logged=0,sk=0,sp=0;
  for(let i=0;i<n;i++){const k=addDays(from,i),d=S.days[k],has=d&&d.items.length,tt=dayTotals(d);
    if(has){logged++;sk+=tt.kcal;sp+=tt.p}
    L.push(`${fmtS(k)} — ${has?`${f0(tt.kcal)} · ${f0(tt.p)}/${f0(tt.f)}/${f0(tt.c)}`:'нет записей'}${d&&d.water?` · вода ${f1(d.water/1000)} л`:''}`)}
  if(logged)L.push(`Среднее за ${logged} дн. с записями: ${f0(sk/logged)} ккал, белок ${f0(sp/logged)} г`);
  const wo=S.workouts.filter(w=>w.date>=from&&w.date<=t).sort((a,b)=>a.date.localeCompare(b.date));
  L.push('',`ТРЕНИРОВКИ: ${wo.length}`);
  wo.forEach(w=>{const dn=w.rows.filter(r=>r.done).length;L.push(`• ${fmtS(w.date)} — ${w.dayName}, сделано ${dn} из ${w.rows.length}`);
    const wt=w.rows.filter(r=>r.w).map(r=>`${r.name} ${r.w} кг`);if(wt.length)L.push('  '+wt.join('; '));if(w.note)L.push('  Заметка: '+w.note)});
  const ws=S.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(ws.length){const last=ws[ws.length-1],inP=ws.filter(x=>x.date>=from);
    L.push('',`ВЕС: ${f1(last.kg)} кг (${fmtS(last.date)})${inP.length>1?`, за период ${sgn(last.kg-inP[0].kg)} кг`:''}${ws.length>1?`, с начала ${sgn(last.kg-ws[0].kg)} кг`:''}`)}
  const ms=S.measures.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(ms.length){const m1=ms[ms.length-1],m0=ms[0];
    L.push(`ЗАМЕРЫ (${fmtS(m1.date)}): `+MEAS.filter(([k])=>m1[k]!=null&&m1[k]!=='').map(([k,l])=>`${l.toLowerCase()} ${f1(m1[k])}${ms.length>1&&m0[k]!=null&&m0[k]!==''?` (${sgn(m1[k]-m0[k])})`:''}`).join(', '))}
  if(detail){L.push('','СПИСОК ПРОДУКТОВ');
    for(let i=0;i<n;i++){const k=addDays(from,i),d=S.days[k];if(!d||!d.items.length)continue;L.push(fmtS(k));
      MEALS.forEach(m=>{const its=d.items.filter(x=>x.meal===m);if(its.length)L.push(`  ${m}: `+its.map(x=>x.manual?`${x.name} (${f0(x.kcal)} ккал)`:`${x.name} ${f0(x.grams)} г`).join(', '))})}}
  return L.join('\n');
}

/* ---------- codes ---------- */
function b64e(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64d(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function decodeCode(text,prefix){const t=String(text||'').replace(/\s+/g,'');const i=t.indexOf(prefix);if(i<0)return null;try{return JSON.parse(b64d(t.slice(i+prefix.length)))}catch(e){return null}}
function validProgram(p){return p&&Array.isArray(p.days)&&p.days.every(d=>d&&typeof d.name==='string'&&Array.isArray(d.ex))}

  saveEdit(){const k=ui.date,id=ui.editId;const vals={g:toNum($('#eGrams')?.value),kc:toNum($('#eKcal')?.value),p:toNum($('#eP')?.value),f:toNum($('#eF')?.value),c:toNum($('#eC')?.value)};const meal=ui.editMeal;
    mutate(()=>{const it=getDay(k).items.find(x=>x.id===id);if(!it)return;it.meal=meal;
      if(it.manual){if(vals.kc>=0)it.kcal=vals.kc;it.p=vals.p||0;it.f=vals.f||0;it.c=vals.c||0}else if(vals.g>0)it.grams=Math.round(vals.g)});
    closeSheet();render()},
  deleteItem(){const k=ui.date,id=ui.editId;let rem=null,idx=-1;
    mutate(()=>{const d=getDay(k);idx=d.items.findIndex(x=>x.id===id);if(idx>=0)rem=d.items.splice(idx,1)[0]});
    closeSheet();render();if(rem){ui.undo={k,item:rem,idx};toast(`Удалено: ${rem.name}`,{a:'undoItem',label:'Вернуть'})}},
  undoItem(){const u=ui.undo;if(!u)return;mutate(()=>{const d=getDay(u.k,true);d.items.splice(Math.min(u.idx,d.items.length),0,u.item)});ui.undo=null;$('#toast').hidden=true;render()},
  confirmNo(){ui.confirm=null;render()},
  /* training */
  startDay(b){const day=S.program.days.find(d=>d.id===b.dataset.id);if(!day)return;
    mutate(()=>{S.session={dayId:day.id,dayName:day.name,date:todayKey(),note:'',rows:day.ex.map(e=>({exId:e.id,name:e.name,scheme:e.scheme,done:false,w:''}))}});render();window.scrollTo(0,0)},
  finishSession(){const s=S.session;if(!s)return;
    mutate(()=>{S.workouts.push({id:uid(),date:s.date||todayKey(),dayId:s.dayId,dayName:s.dayName,note:s.note||'',rows:s.rows.map(r=>({exId:r.exId,name:r.name,done:!!r.done,w:r.w||''}))});S.session=null});
    ui.confirm=null;render();toast('Тренировка записана')},
  cancelSession(){ui.confirm='cancelSession';render()},
  cancelSessionYes(){mutate(()=>{S.session=null});ui.confirm=null;render()},
  delWorkout(b){const id=b.dataset.id;let rem=null,idx=-1;mutate(()=>{idx=S.workouts.findIndex(w=>w.id===id);if(idx>=0)rem=S.workouts.splice(idx,1)[0]});render();
    if(rem){ui.undo={w:rem,idx};toast('Тренировка удалена',{a:'undoWorkout',label:'Вернуть'})}},
  undoWorkout(){const u=ui.undo;if(!u||!u.w)return;mutate(()=>{S.workouts.splice(Math.min(u.idx,S.workouts.length),0,u.w)});ui.undo=null;$('#toast').hidden=true;render()},
  progEdit(){ui.editProg=true;ui.progCode='';ui.confirm=null;render();window.scrollTo(0,0)},
  progDone(){ui.editProg=false;ui.confirm=null;mutate(()=>{S.program.days.forEach(d=>{d.ex=d.ex.filter(e=>e.name.trim())})});render()},
  exAdd(b){const di=+b.dataset.d;mutate(()=>{S.program.days[di].ex.push({id:uid(),name:'',scheme:'3 × 12'})});render();
    const ins=document.querySelectorAll(`[data-in="exName"][data-d="${di}"]`);ins[ins.length-1]?.focus()},
  exDel(b){const di=+b.dataset.d,ei=+b.dataset.e;mutate(()=>{S.program.days[di].ex.splice(ei,1)});render()},
  exUp(b){const di=+b.dataset.d,ei=+b.dataset.e;if(ei<1)return;mutate(()=>{const a=S.program.days[di].ex;[a[ei-1],a[ei]]=[a[ei],a[ei-1]]});render()},
  exDown(b){const di=+b.dataset.d,ei=+b.dataset.e;const a=S.program.days[di].ex;if(ei>=a.length-1)return;mutate(()=>{[a[ei+1],a[ei]]=[a[ei],a[ei+1]]});render()},
  dayAdd(){mutate(()=>{const used=new Set(S.program.days.map(d=>d.name));const L='АБВГДЕЖЗ';let nm='Новый день';for(const c of L){if(!used.has('День '+c)){nm='День '+c;break}}S.program.days.push({id:uid(),name:nm,ex:[{id:uid(),name:'',scheme:'3 × 12'}]})});render()},
  dayDel(b){ui.confirm='delDay'+b.dataset.d;render()},
  dayDelYes(b){const di=+b.dataset.d;mutate(()=>{S.program.days.splice(di,1)});ui.confirm=null;render()},
  progExport(){ui.progCode='PRG1:'+b64e(JSON.stringify(S.program));render()},
  copyProg(){copyText(ui.progCode,$('#progCodeTa'))},
  toggleImport(){ui.showImport=!ui.showImport;ui.confirm=null;render()},
  progImport(){const p=decodeCode($('#progImport')?.value,'PRG1:');if(!validProgram(p)){toast('Код не подходит. Скопируйте его целиком, начиная с PRG1:');return}
    p.days.forEach(d=>{d.id=d.id||uid();d.ex=d.ex.map(e=>({id:e.id||uid(),name:String(e.name||''),scheme:String(e.scheme||'')}))});ui.pendingImport=p;ui.confirm='progImport';render()},
  progImportYes(){const p=ui.pendingImport;if(!p)return;mutate(()=>{S.program=p});ui.pendingImport=null;ui.confirm=null;ui.showImport=false;render();toast('Программа загружена')},
  /* progress */
  saveWeight(){const kg=toNum($('#wKg')?.value),date=$('#wDate')?.value||todayKey();
    if(!(kg>20&&kg<400)){toast('Введите вес в килограммах, например 67,5');$('#wKg')?.focus();return}
    mutate(()=>{S.weights=S.weights.filter(w=>w.date!==date);S.weights.push({date,kg:Math.round(kg*10)/10});S.weights.sort((a,b)=>a.date.localeCompare(b.date));
      if(S.weights[S.weights.length-1].date===date)S.profile.weight=String(Math.round(kg*10)/10)});
    render();toast('Вес записан')},
  delWeight(b){const date=b.dataset.d;let rem=null;mutate(()=>{rem=S.weights.find(w=>w.date===date);S.weights=S.weights.filter(w=>w.date!==date)});render();
    if(rem){ui.undo={wt:rem};toast('Запись веса удалена',{a:'undoWeight',label:'Вернуть'})}},
  undoWeight(){const u=ui.undo;if(!u||!u.wt)return;mutate(()=>{S.weights.push(u.wt);S.weights.sort((a,b)=>a.date.localeCompare(b.date))});ui.undo=null;$('#toast').hidden=true;render()},
  saveMeasures(){const date=$('#mDate')?.value||todayKey();const rec={date};let any=false;
    MEAS.forEach(([k])=>{const v=toNum($('#m_'+k)?.value);if(v>0){rec[k]=Math.round(v*10)/10;any=true}});
    if(!any){toast('Впишите хотя бы один замер в сантиметрах');return}
    mutate(()=>{const ex=S.measures.find(m=>m.date===date);if(ex)Object.assign(ex,rec);else S.measures.push(rec);S.measures.sort((a,b)=>a.date.localeCompare(b.date))});
    render();toast('Замеры сохранены')},
  /* more */
  repDays(b){ui.repDays=+b.dataset.n;ui.report='';render()},
  makeReport(){ui.report=buildReport(ui.repDays,ui.repDetail);render();setTimeout(()=>$('#reportTa')?.scrollIntoView({block:'center',behavior:'smooth'}),30)},
  copyReport(){copyText(ui.report,$('#reportTa'))},
  shareReport(){try{AndroidBridge.share(ui.report)}catch(e){copyText(ui.report,$('#reportTa'))}},
  addCustom(){const name=($('#cName')?.value||'').trim(),kc=toNum($('#cKcal')?.value);
    if(!name){toast('Впишите название продукта');$('#cName')?.focus();return}
    if(!(kc>=0)){toast('Впишите калорийность на 100 г');$('#cKcal')?.focus();return}
    mutate(()=>{S.custom.push({id:'c'+uid(),name,kcal:kc,p:toNum($('#cP')?.value)||0,f:toNum($('#cF')?.value)||0,c:toNum($('#cC')?.value)||0,piece:toNum($('#cPiece')?.value)||0})});
    render();toast('Продукт добавлен')},
  delCustom(b){mutate(()=>{S.custom=S.custom.filter(c=>c.id!==b.dataset.id)});render()},
  makeBackup(){ui.backup='BAK1:'+b64e(JSON.stringify(S));render()},
  copyBackup(){copyText(ui.backup,$('#backupTa'))},
  restore(){const d=decodeCode($('#restoreTa')?.value,'BAK1:');if(!d||typeof d!=='object'||!d.days){toast('Код не подходит. Скопируйте его целиком, начиная с BAK1:');return}ui.pendingRestore=d;ui.confirm='restore';render()},
  restoreYes(){const d=ui.pendingRestore;if(!d)return;const b=blankState();S=Object.assign(b,d);S.profile=Object.assign(blankState().profile,d.profile||{});S.demo=false;save();ui.pendingRestore=null;ui.confirm=null;ui.date=todayKey();render();toast('Записи восстановлены')},
  wipe(){ui.confirm='wipe';render()},
  wipeYes(){S=blankState();save();ui.confirm=null;ui.report='';ui.backup='';ui.date=todayKey();render();toast('Все данные удалены')}
};
const IN={
  foodText(el){ui.text=el.value;clearTimeout(IN._t);IN._t=setTimeout(renderPreview,140)},
  foodSearch(el){ui.q=el.value;renderSearch()},
  pvGrams(el){const i=+el.dataset.i,x=ui.pv[i];if(!x)return;const v=toNum(el.value);ui.over[x.key]=isNaN(v)?'':v;x.grams=isNaN(v)?0:v;const c=$('#pvk'+i);if(c&&!x.food.water)c.textContent=f0(pvKcal(x))+' ккал';updateCommit()},
  editGrams(el){const it=getDay(ui.date).items.find(x=>x.id===ui.editId);if(it)$('#eInfo').textContent=editInfo(it,el.value)},
  sessW(el){if(!S.session)return;S.session.rows[+el.dataset.i].w=el.value.trim();save()},
  sessNote(el){if(!S.session)return;S.session.note=el.value;save()},
  sessDate(el){if(!S.session||!el.value)return;S.session.date=el.value;save()},
  progTitle(el){mutate(()=>{S.program.title=el.value})},
  progNote(el){mutate(()=>{S.program.note=el.value})},
  dayName(el){mutate(()=>{S.program.days[+el.dataset.d].name=el.value})},
  exName(el){mutate(()=>{S.program.days[+el.dataset.d].ex[+el.dataset.e].name=el.value})},
  exScheme(el){mutate(()=>{S.program.days[+el.dataset.d].ex[+el.dataset.e].scheme=el.value})},
  pf(el){const f=el.dataset.f,v=el.value;const wasDemo=S.demo;mutate(()=>{S.profile[f]=v});
    if(wasDemo){render();const n=document.querySelector(`[data-f="${f}"]`);if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}}}
    else{const nb=$('#normBox');if(nb)nb.innerHTML=normHtml()}}
};
const CH={
  sessDone(el){if(!S.session)return;S.session.rows[+el.dataset.i].done=el.checked;save()},
  pf(el){mutate(()=>{S.profile[el.dataset.f]=el.value});const nb=$('#normBox');if(nb)nb.innerHTML=normHtml()},
  pfManual(el){mutate(()=>{S.profile.manual=el.checked});render()},
  repDetail(el){ui.repDetail=el.checked;ui.report=''}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const fn=A[b.dataset.a];if(fn){e.preventDefault();fn(b,e)}});
document.addEventListener('input',e=>{const el=e.target;const h=el.dataset&&el.dataset.in;if(h&&IN[h])IN[h](el,e)});
document.addEventListener('change',e=>{const el=e.target;const h=el.dataset&&el.dataset.ch;if(h&&CH[h])CH[h](el,e)});
$('#sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

customProvider=()=>S.custom;
window.appBack=()=>{if(ui.sheet){closeSheet();return true}if(ui.confirm){ui.confirm=null;render();return true}if(ui.editProg){ui.editProg=false;render();return true}if(ui.tab!=='today'){ui.tab='today';render();window.scrollTo(0,0);return true}return false};
const h=location.hash.replace('#','');if(['today','train','progress','more'].includes(h))ui.tab=h;
render();
})();
</script>
</body>
</html>
